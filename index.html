<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaisonFit prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE fashion house app for everyone: calm, confident, editorial
   IDEA the morning flat-lay a stylist lays on your bed, shot like a lookbook
   PICTURE today's outfit as one large flat-lay canvas, pieces placed and shadowed like a product shoot
   COLOUR black field, white app, warm grey studio backdrop, black ink, blush as the only accent
   TYPE Bodoni Moda for titles + Manrope for interface
   LAYOUT phone-sized app centred on black; full screen on a phone */
:root{color-scheme:light;--field:#0d0d0d;--ink:#0e0e0e;--mut:#8a857f;--line:#ebe8e4;--studio:#f3f1ee;--studio2:#e9e5e0;--blush:#d8c8b0;--ok:#1f7a4d;--paper:#fff}
:root[data-mode=dark]{color-scheme:dark;--ink:#f3efe9;--mut:#958f88;--line:#34312e;--studio:#2a2826;--studio2:#34312e;--paper:#0f0f10;--ok:#4fbf86}
:root[data-mode=dark] .phone{box-shadow:0 0 0 1px #2b2927}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--field);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column;align-items:center;padding:28px 16px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.phone{width:min(100%,410px);background:var(--paper);border-radius:46px;border:9px solid #1e1e1e;box-shadow:0 0 0 1px #333,0 40px 80px -30px rgba(0,0,0,.8);overflow:hidden;display:flex;flex-direction:column;min-height:min(860px,calc(100vh - 80px));position:relative}
.cap{color:#8f8a85;font-size:13px;margin:14px 0 0;text-align:center}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 2px;font-weight:700;font-size:14px}
.screen{flex:1;overflow:auto;padding:6px 20px 20px;display:flex;flex-direction:column;gap:16px}
.screen>*{flex:none}
.brandbar{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.logo{display:flex;align-items:center;gap:10px;font:500 17px/1 'Bodoni Moda',serif;letter-spacing:.3em}
.lm{width:34px;height:34px;border-radius:9px;background:#d8c8b0;padding:4px;display:grid;place-items:center}
.date{font-size:13px;color:var(--mut)}
h1{font:500 34px/1.04 'Bodoni Moda',serif;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1 em{font-style:italic}
h2{font:500 22px/1.15 'Bodoni Moda',serif;margin:0}
.sub{color:var(--mut);margin:0;font-size:14px}
.notif{background:rgba(28,28,30,.86);backdrop-filter:blur(14px);color:#fff;border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;animation:drop .7s cubic-bezier(.2,.8,.2,1)}
.notif .ic{width:38px;height:38px;border-radius:10px;background:#d8c8b0;display:grid;place-items:center;padding:4px}
.notif b{display:block;font-size:14px;font-weight:700}
.notif small{opacity:.78;font-size:13px;line-height:1.35;display:block}
.notif time{font-size:12px;opacity:.6;align-self:start}
@keyframes drop{from{transform:translateY(-28px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.notif,.sheet{animation:none}}
.ctx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ctx label{padding:8px 0;display:flex;flex-direction:column}
.ctx label+label{border-left:1px solid var(--line);padding-left:14px}
.ctx span{font-size:12px;color:var(--mut)}
.ctx select{border:0;background:transparent;font-weight:700;font-size:15px;padding:0;min-height:28px;appearance:none;-webkit-appearance:none}
.canvas{position:relative;aspect-ratio:1/1.12;border-radius:26px;background:radial-gradient(120% 90% at 30% 20%,var(--studio),var(--studio2));overflow:hidden}
.canvas .p{position:absolute;border:0;background:none;padding:0}
.canvas .p svg{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 14px rgba(60,40,20,.18)) drop-shadow(0 2px 2px rgba(60,40,20,.12))}
.canvas .s-top{left:4%;top:3%;width:56%}
.canvas .s-bottom{left:8%;top:43%;width:50%}
.canvas .s-shoes{right:5%;bottom:4%;width:36%}
.canvas .s-outer{right:2%;top:4%;width:46%;transform:rotate(7deg)}
.canvas.noout .s-top{left:22%;width:56%}
.canvas.noout .s-bottom{left:6%}
.canvas .lbl{position:absolute;left:16px;bottom:14px;background:var(--paper);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.lrow>button:first-child{border-bottom:0 !important}
.list .swapb{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;min-height:36px;font-weight:700;font-size:13px;background:var(--paper)}
.list .addpiece{display:flex;justify-content:center;font-weight:700;font-size:14px;color:var(--ink)}
.list button{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;text-align:left;min-height:56px}
.list .th{width:44px;height:44px;border-radius:10px;background:var(--studio);display:grid;place-items:center}
.list .th svg{width:36px;height:36px}
.list small{color:var(--mut)}
.why{font-size:14px;color:var(--mut);margin:0;font-style:italic;font-family:'Bodoni Moda',serif;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>button{flex:1 1 140px}
.btn{min-height:52px;border-radius:999px;border:0;font-weight:700;padding:12px 18px;background:var(--ink);color:var(--paper);font-size:15px}
.btn.acc{background:var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink)}
.btn.soft{background:var(--blush);color:var(--ink)}
.btn:disabled{opacity:.45}
.done{background:var(--studio);border-radius:16px;padding:12px 14px;font-size:14px}
.cnt{font-size:12px;color:var(--mut);text-align:center;margin:0}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);background:var(--paper);padding-bottom:6px}
.tabs button{border:0;background:none;padding:12px 2px 10px;color:#b0aba5;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px}
.tabs button[aria-current=true]{color:var(--ink)}
.tabs svg{width:25px;height:25px}
.tripcard{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--studio);border-radius:18px;padding:12px 14px;text-align:left;margin:4px 0 10px}
.tripcard .ic{width:44px;height:44px;border-radius:50%;background:var(--acc,#d8c8b0);display:grid;place-items:center;flex:none}
.tripcard .ic svg{width:24px;height:24px}
.tripcard b{display:block;font-size:15px}.tripcard small{color:var(--mut);font-size:13px}
.tripcard>span:nth-child(2){flex:1}.tripcard .ar{font-size:24px;color:var(--mut)}
.tin{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:600 16px Manrope,system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:48px}
.tin:focus{outline:2px solid var(--ink);outline-offset:1px}
.tdates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tdates label{display:flex;flex-direction:column}
.twx{display:flex;align-items:center;gap:12px;background:var(--studio);border-radius:16px;padding:12px 14px;margin:12px 0 2px}
.twx .src{display:block;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink);opacity:.6;margin-top:3px}
.twx b{display:block;font-size:15px}.twx small{color:var(--mut);font-size:13px}
.stp{display:inline-flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:999px;padding:4px}
.stp button{width:36px;height:36px;border-radius:50%;border:0;background:var(--studio);font-size:20px;font-weight:700}
.stp b{min-width:70px;text-align:center}
.pbar{height:6px;border-radius:3px;background:var(--studio);overflow:hidden;margin:-4px 0 12px}.pbar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.pk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pk button{position:relative;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;min-height:44px}
.pk button svg{width:100%;height:56px}
.pk button[aria-pressed=true]{background:var(--studio);border-color:var(--ink)}
.pk button[aria-pressed=true] svg{opacity:.45}
.pk em,.ess em{font-style:normal;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;background:var(--paper);flex:none}
.pk em{position:absolute;top:6px;right:6px}
.pk button[aria-pressed=true] em,.ess button[aria-pressed=true] em{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ess{display:flex;flex-direction:column;gap:2px}
.ess button{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;font-size:14px;text-align:left;min-height:44px}
.ess button[aria-pressed=true] span{text-decoration:line-through;color:var(--mut)}
.mdot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;vertical-align:-2px;border:1.5px solid #8a857f}.mdot.light{background:#fff}.mdot.dark{background:#0e0e0e}
.tuto{text-align:center;padding:6px 4px 2px}
.tuto .ic{width:76px;height:76px;border-radius:50%;background:var(--acc,#d8c8b0);display:grid;place-items:center;margin:4px auto 14px;color:var(--ink)}
.tuto .ic svg{width:34px;height:34px}
.tuto .ic .av{width:52px!important;height:52px!important}
.tuto h2{font-family:'Bodoni Moda',serif;font-size:26px;margin:0 0 6px}
.tuto p{margin:0 auto;max-width:280px;color:#6b665f;font-size:15px;line-height:1.45}
.tuto .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9a948c;font-weight:700;margin-bottom:6px}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0 14px}
.dots i{width:6px;height:6px;border-radius:3px;background:#ddd7cf;transition:width .2s}
.dots i.on{width:18px;background:var(--ink)}
.trow{display:flex;gap:10px}.trow .btn{flex:1}
.filt{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filt button{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 15px;font-weight:700;font-size:13px;min-height:38px}
.filt button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
.piece{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.piece .ph{background:radial-gradient(100% 80% at 30% 20%,var(--studio),var(--studio2));border-radius:18px;aspect-ratio:4/5;display:grid;place-items:center;width:100%}
.piece .ph svg{width:74%;height:auto;filter:drop-shadow(0 10px 10px rgba(60,40,20,.16))}
.piece b{font-size:13px;font-weight:700;line-height:1.25}
.piece small{font-size:12px;color:var(--mut);margin-top:-4px}
.add{border:1.5px dashed #cfcac4;background:var(--paper);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;color:var(--mut);aspect-ratio:4/5}
.add span{font:400 36px/1 'Bodoni Moda',serif;color:var(--ink)}
.ov{position:absolute;inset:0;background:rgba(10,10,10,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--paper);border-radius:30px 30px 0 0;width:100%;max-height:90%;overflow:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet:before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center;margin-top:-10px}
@keyframes up{from{transform:translateY(50px)}to{transform:none}}
.hero{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.mini{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.mini .piece{flex:none;width:92px}
.mini .piece .ph{border-radius:14px}
.olist{display:flex;flex-direction:column;gap:10px}
.outfit{background:radial-gradient(100% 80% at 30% 20%,var(--studio),var(--studio2));border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:4px;align-items:center}
.outfit svg{width:100%;height:58px;filter:drop-shadow(0 6px 6px rgba(60,40,20,.15))}
.heart{border:0;background:var(--paper);border-radius:50%;width:44px;height:44px;font-size:18px}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}
.stat b{font:500 30px 'Bodoni Moda',serif;white-space:nowrap}
.warn{background:var(--blush);border-radius:16px;padding:12px 14px;font-size:14px}
.big{font:500 64px/1 'Bodoni Moda',serif}
.cand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cand .piece .ph{border:1.5px solid transparent;border-radius:14px}
.cand .piece[aria-pressed=true] .ph{border-color:var(--ink)}
.cand .piece small{margin-top:0}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:18px;padding:14px 16px;width:100%}
.offer.best{border-color:var(--ink)}
.offer small{color:var(--mut);grid-column:1}
.offer .pr{grid-row:1/3;grid-column:2;font:500 24px 'Bodoni Moda',serif;white-space:nowrap}
.tag{background:var(--blush);border-radius:999px;padding:1px 8px;font-size:11px;margin-left:6px}
.blur{filter:blur(7px);pointer-events:none;user-select:none}
.note{font-size:12px;color:var(--mut);margin:0}
form.addf{display:grid;gap:10px}
form.addf select,form.addf input{border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:16px;width:100%;min-height:48px;background:var(--paper)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--line)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.voice{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 14px;width:100%}
.voice[aria-pressed=true]{border-color:var(--ink);background:var(--studio)}
.voice small{color:var(--mut);font-size:12px}
.voice .vq{font:italic 500 15px/1.35 'Bodoni Moda',serif;margin-top:4px}
.nlook{grid-column:2/4;display:flex;gap:4px;margin-top:2px}
.nlook span{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.nlook svg{width:32px;height:32px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--studio);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;font-weight:800;font-size:13px;min-height:38px}
.seg button[aria-pressed=true]{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px}
.story{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font-size:12px;font-weight:700;width:64px}
.ring{width:60px;height:60px;border-radius:50%;padding:3px;background:conic-gradient(var(--ink),#c9a39a,var(--ink))}
.ring.add{background:none;border:1.5px dashed #bbb;display:grid;place-items:center;font:400 28px 'Bodoni Moda',serif}
.av{width:100%;height:100%;border-radius:50%;border:2px solid var(--paper);display:grid;place-items:center;color:var(--paper);font:600 20px 'Bodoni Moda',serif}
.post{border-bottom:1px solid var(--line);padding-bottom:14px;display:flex;flex-direction:column;gap:10px}
.ph2{display:flex;align-items:center;gap:10px}
.ph2 .av{width:38px;height:38px;border:0;font-size:16px;flex:none}
.ph2 small{color:var(--mut);display:block;font-size:12px}
.ph2 .more{margin-left:auto;border:0;background:none;font-size:18px;color:var(--mut);width:36px;height:36px}
.post .canvas{aspect-ratio:1/1}
.cap2{margin:0;font-size:14px}
.reacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reacts button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;min-height:36px}
.reacts button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.vs .canvas{aspect-ratio:3/4}
.vs b.v{font:italic 500 22px 'Bodoni Moda',serif}
.who{text-align:center;font-weight:800;font-size:13px;margin-top:4px}
.frow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.frow .av{width:44px;height:44px;border:0;font-size:18px}
.frow small{display:block;color:var(--mut);font-size:12px}
.frow button{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;min-height:36px}
.frow button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.glist{display:flex;flex-direction:column}
.gitem{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;text-align:left;width:100%}
.gav{width:52px;height:52px;border-radius:16px;background:var(--studio);display:grid;place-items:center}
.gav svg{width:42px;height:42px}
.gitem small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem .nb{background:var(--ink);color:var(--paper);border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px}
.chathead{display:flex;align-items:center;gap:10px}
.chathead button{border:0;background:none;font-size:24px;width:40px;height:40px}
.chathead small{display:block;color:var(--mut);font-size:12px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg .av{width:30px;height:30px;border:0;font-size:13px;flex:none}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--studio);border-radius:18px 18px 18px 6px;padding:8px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.msg.me .bub{background:var(--ink);color:var(--paper);border-radius:18px 18px 6px 18px}
.bub .nm{font-size:11px;font-weight:800;color:var(--mut)}
.msg.me .bub .nm{display:none}
.haul{background:var(--paper);border-radius:14px;overflow:hidden;color:var(--ink);width:210px}
.haul .hp{background:radial-gradient(100% 80% at 30% 20%,var(--studio),var(--studio2));display:grid;place-items:center;height:130px}
.haul .hp svg{width:110px;height:110px;filter:drop-shadow(0 8px 8px rgba(60,40,20,.18))}
.haul .hb{padding:8px 10px}
.haul .hb b{display:block;font-size:13px}
.haul .hb small{color:var(--mut);font-size:12px}
.haul .hb .pr{float:right;font:500 16px 'Bodoni Moda',serif}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qr button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;min-height:32px;color:var(--ink)}
.sysm{align-self:center;background:var(--blush);border-radius:14px;padding:8px 12px;font-size:13px;max-width:92%}
.comp{position:sticky;bottom:-20px;background:var(--paper);display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;padding:10px 0 4px;border-top:1px solid var(--line)}
.comp input{border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;font-size:16px;min-height:44px}
